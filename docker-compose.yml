services:
  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in root .env}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REACT_APP_CARTO_KEY: ${REACT_APP_CARTO_KEY:-}
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AUTO_CAPTURE=true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
